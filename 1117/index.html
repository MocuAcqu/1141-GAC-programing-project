<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地鼠地鼠</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
     body {
        background-color: lightgrey;
    }
    .jumbotron {
      background-color: rgb(186, 45, 45);
      height: 180px;
    }

    #panel {
        position:relative;
        margin: 0px auto;
        width: 400px;
        height: 300px;
        background-image: url(./images/bg.png);
        background-size:contain;
    }
    #panel img {
        position:absolute;
        left: 0px;
        top: 50px;
    }
    
  </style>

  <script>
        let idx = 0;
        let msg = new Array(5);
        msg[0] = "Hello World!";
        msg[1] = "早安";
        msg[2] = "很高興見到你";
        msg[3] = "Hi";
        msg[4] = "嘻嘻，我猜到你會來找我";
        let colors = new Array(5);
        colors[0] = "#E3547F";
        colors[1] = "#E36754";
        colors[2] = "#E36754";
        colors[3] = "#E37254";
        colors[4] = "#E35460";
        let images = new Array(5);
        images[0] = "./images/d0.png";
        images[1] = "./images/d1.png";
        images[2] = "./images/d2.png";
        images[3] = "./images/d3.png";
        images[4] = "./images/d4.png";
        let pos = new Array(5);
        pos[0] = { x: 70, y:18 };
        pos[1] = { x: 53, y:90 };
        pos[2] = { x: 275, y: 145 };
        pos[3] = { x: 150, y: 14 };
        pos[4] = { x: 153, y: 90 };
        setInterval(change, 1000) 
        function change(){
            idx = (idx + 1) % 5;
            document.getElementById("where").innerHTML = msg[idx];
            document.getElementById("top").style.backgroundColor = colors[idx];
            document.getElementById("digit").src = images[idx];
            let i = Math.floor(Math.random()*5);
            document.getElementById("g").style.left = pos[i].x + "px";
            document.getElementById("g").style.top = pos[i].y + "px";
        }
        

  </script>
</head>

<body>
  <div class="container">
    <div id="top" class="jumbotron mt-3">
    <h1 id="where">終於看到你了</h1>
      <p style="color: #ffffff;">i want to play a game</p>
    </div>
    <p align="center">
        <img id="digit" src="./images/d0.png" width="100">
    </p>
    <div id="panel">
        <img id="g" src="./images/g.png" width="100" style="left: 150px; top:14px;">
    </div>
</body>
</html>
