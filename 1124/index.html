<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地鼠地鼠</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      background: linear-gradient(180deg, #d7d7d7, #bcbcbc);
      font-family: "Trebuchet MS", sans-serif;
    }

    /* ---- 標題區 ---- */
    .jumbotron {
      background: linear-gradient(90deg, #8b2e2e, #b84a4a);
      color: white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.35);
      border-radius: 10px;
    }

    h1#here {
      font-weight: 900;
      letter-spacing: 2px;
      text-shadow: 2px 2px 4px black;
    }

    /* ---- 狀態列 ---- */
    #status {
      width: 420px;
      height: 70px;
      margin: 0 auto;
      background: #ffffffdd;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
      position: relative;
      margin-bottom: 15px;
    }

    #score, #time {
      position: absolute;
      top: 15px;
      font-size: 26px;
      font-weight: bold;
    }

    #score {
      left: 20px;
      color: #d11e1e;
    }

    #time {
      right: 20px;
      color: #1e3bd1;
    }

    /* ---- 遊戲場景 ---- */
    #panel {
      position: relative;
      background-image: url(./images/lawn.jpg);
      background-size: cover;
      width: 420px;
      height: 420px;
      margin: 0 auto;
      border-radius: 12px;
      box-shadow: inset 0 0 12px rgba(0,0,0,0.5), 0 4px 10px rgba(0,0,0,0.5);
      border: 4px solid #5c5c5c;
      margin-bottom: 10%;
    }

    /* ---- 地鼠 ---- */
    #g0, #g1, #g2 {
      position:absolute;
      width:60px;
      height:60px;
      display:none;
      cursor: pointer;
      transition: transform 0.1s;
    }

    #g0:hover, #g1:hover, #g2:hover {
      transform: scale(1.15);
      filter: drop-shadow(0 0 4px yellow);
    }

    /* ---- 按鈕美化 ---- */
    #btnStart, #btnReset {
      width: 140px;
      font-size: 20px;
      padding: 10px;
      font-weight: bold;
      border-radius: 8px;
      letter-spacing: 1px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3);
      transition: 0.1s;
    }

    #btnStart:active, #btnReset:active {
      transform: scale(0.95);
      box-shadow: none;
    }

    .btn-area {
      text-align: center;
      margin-bottom: 15px;
    }
  </style>

  <script>
    let pos = [
      { x:150, y:150 },
      { x:300, y:120 },
      { x:150, y:250 },
      { x:300, y:220 },
      { x:80,  y:80  },
      { x:250, y:50  }
    ];

    let gophers = [];
    let changeSpeed = 800;
    let explodeDuration = 800; 
    let score = 0;
    let time = 30;
    let gameTimer, changeTimer;

    window.onload = () => {
      for (let i = 0; i < 3; i++) {
        let el = document.getElementById("g" + i);
        el.onclick = () => hit(i);

        gophers.push({
          el: el,
          alive: true,
          isGopher: true,
          canHit: true,
          explodeTimeout: null
        });
      }
    };

    function go() {
      score = 0;
      time = 30;

      document.getElementById("score").innerHTML = score;
      document.getElementById("time").innerHTML = time;
      document.getElementById("btnStart").disabled = true;

      changeMoles();
      changeTimer = setInterval(changeMoles, changeSpeed);
      gameTimer = setInterval(countdown, 1000);
    }

    function countdown() {
      time--;
      document.getElementById("time").innerHTML = time;

      if (time <= 0) {
        endGame();
      }
    }

    // 讓三隻地鼠同時出現／更新
    function changeMoles() {
      for (let i = 0; i < 3; i++) {
        let m = gophers[i];

        // 若正在爆炸，就跳過
        if (!m.alive) continue;

        // 1. 隨機位置
        let p = pos[Math.floor(Math.random() * pos.length)];
        m.el.style.left = p.x + "px";
        m.el.style.top = p.y + "px";

        // 2. 10% 是狗狗
        if (Math.random() < 0.1) {
          m.isGopher = false;
          m.el.src = "./images/puppy.png";
        } else {
          m.isGopher = true;
          m.el.src = "./images/gopher.png";
        }

        m.canHit = true;
        m.el.style.display = "block";
      }
    }

    // 點擊地鼠
    function hit(i) {
      let m = gophers[i];
      if (!m.canHit) return;
      m.canHit = false;

      // 計分
      score += m.isGopher ? 1 : -3;
      document.getElementById("score").innerHTML = score;

      // 爆炸
      m.alive = false;
      m.el.src = "./images/bomb.png";

      setTimeout(() => {
        m.el.style.display = "none";
        m.alive = true; // 恢復下一輪可以出現
      }, explodeDuration);
    }

    function endGame() {
      clearInterval(gameTimer);
      clearInterval(changeTimer);

      // 隱藏所有地鼠
      gophers.forEach(m => {
        m.el.style.display = "none";
      });

      alert("Time's up! Score = " + score);

      document.getElementById("btnStart").disabled = false;
    }

    function reset() {
      clearInterval(gameTimer);
      clearInterval(changeTimer);

      score = 0;
      time = 30;

      document.getElementById("score").innerHTML = score;
      document.getElementById("time").innerHTML = time;

      gophers.forEach(m => m.el.style.display = "none");

      document.getElementById("btnStart").disabled = false;
    }

  </script>
</head>

<body>
  <div class="container">
    <div id="top" class="jumbotron mt-3 text-center">
      <h1 id="here">GOPHER</h1>
      <p style="color: #ffffff;">i want to play a game</p>
    </div>

    <div class="btn-area">
      <input id="btnStart" type="button" value="START" class="btn btn-danger" onclick="go()">
      <input id="btnReset" type="button" value="RESET" class="btn btn-success" onclick="reset()">
    </div>

    <div id="status"> 
      <div id="score">0</div>
      <div id="time">30</div>
    </div>

    <div id="panel">
      <img id="g0" src="./images/gopher.png">
      <img id="g1" src="./images/gopher.png">
      <img id="g2" src="./images/gopher.png">
    </div>
  </div>
</body>
</html>
